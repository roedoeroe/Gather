<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gather — Image derivative</title><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="capture.css"></head><body><main class="capture-main"><h1>Prepare a shareable image</h1><p id="editSource" class="quiet"></p><p>Original images remain unchanged. Black rectangles are flattened into a new PNG. All-work backups still include unredacted originals.</p><p id="editStatus" role="status"></p><canvas id="editCanvas" style="max-width:100%;height:auto;border:1px solid #cdd9d0"></canvas><form id="redactForm"><div class="crop-fields"><label>Left <input id="redactX" type="number" min="0" value="0" required></label><label>Top <input id="redactY" type="number" min="0" value="0" required></label><label>Width <input id="redactWidth" type="number" min="1" value="100" required></label><label>Height <input id="redactHeight" type="number" min="1" value="40" required></label></div><div class="add-actions"><button>Add black redaction</button><button id="cropDerivative" type="button">Crop to this rectangle</button><button id="undoDerivative" type="button">Undo last edit</button></div></form><label class="capture-caption">Caption / analyst annotation (kept beside the image)<textarea id="derivativeNote" maxlength="20000" style="display:block;width:100%;margin-top:8px"></textarea></label><div class="add-actions"><button id="saveDerivative" class="primary">Save derivative for export</button><button id="closeDerivative">Close</button></div></main><script type="module" src="capture-edit.js"></script></body></html>

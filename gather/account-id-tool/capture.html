<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gather — Capture</title><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="capture.css"><link rel="stylesheet" href="capture-viewer.css"></head>
<body><main class="capture-main"><header class="section-heading"><h1>Screenshot</h1><button id="cancel">Cancel capture</button></header>
<p id="destination" class="context-label"></p><p id="status" role="status" aria-live="polite">Preparing capture…</p>
<details id="captureDetails"><summary>Source & capture details</summary><p id="source" class="quiet"></p><p id="limitations" class="micro"></p></details>
<section id="selection" hidden><h2>Select an area</h2><p class="quiet">Drag across the screenshot, then save. The original image stays in your private backup.</p>
<div id="imageArea"><img id="preview" alt="Captured page for rectangle selection" draggable="false"><div id="outline"></div></div>
<form id="cropForm"><details id="selectionCoordinates"><summary>Adjust selection with coordinates</summary><div class="crop-fields"><label>Left <input id="cropX" type="number" min="0" value="0" required></label><label>Top <input id="cropY" type="number" min="0" value="0" required></label><label>Width <input id="cropWidth" type="number" min="1" required></label><label>Height <input id="cropHeight" type="number" min="1" required></label></div></details><button id="saveSelection" class="primary">Save selection</button></form></section>
<div id="completed" hidden><p id="savedState"></p><div class="capture-result"><div id="savedPreview"></div><aside class="capture-actions" aria-label="Saved image actions"><button id="copy" class="primary">Copy image</button><div class="image-save"><select id="imageFormat" aria-label="Image format"><option value="png">PNG</option><option value="jpg">JPEG</option></select><button id="saveImage">Save image…</button></div><button id="print">Print / Save PDF</button><button id="edit">Edit image</button><p id="outputStatus" role="status" aria-live="polite" class="micro"></p><hr><button id="workspace">View in scan</button><button id="history">Capture history</button><details><summary>Folder export</summary><p id="exportState"></p><button id="export">Export to folder</button><p class="micro">Image + capture record in Downloads / Gather. Originals remain in Gather.</p></details><button id="close">Done</button></aside></div></div>
</main><script type="module" src="capture.js"></script></body></html>
